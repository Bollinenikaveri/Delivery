/**:
  ros__parameters:
    # Confidence threshold for victim detection (0.0 - 1.0)
    confidence_threshold: 0.75

    # GPS tolerance for target reached (meters)
    target_tolerance_m: 1.5

    # State timeouts (seconds)
    state_timeouts:
      NAVIGATING: 60
      ALIGNING: 30
      CONFIRMING: 15
      DROPPING: 30

    # ============== MAVSDK Configuration ==============
    # Connection URL for MAVSDK
    # Options:
    #   - udp://:14540        (PX4 SITL simulation)
    #   - udp://:14550        (QGroundControl default)
    #   - serial:///dev/ttyUSB0:57600   (USB telemetry radio)
    #   - serial:///dev/ttyACM0:115200  (direct USB to Pixhawk)
    connection_url: "udp://:14540"
    
    # Simulation mode (true = no real drone, false = connect to real drone)
    simulation_mode: true

    # ============== Telemetry Monitor Thresholds ==============
    low_battery_threshold: 20.0      # Warning level (%)
    critical_battery_threshold: 10.0  # Critical level - land immediately (%)
    max_attitude_angle: 45.0          # Max roll/pitch before warning (degrees)

    # ============== Drone Parameters ==============
    drone:
      max_altitude_m: 100
      cruise_speed_ms: 15
      takeoff_altitude_m: 10.0
      battery_capacity_percent: 100
      gps_accuracy_m: 2.0

    # Camera parameters
    camera:
      resolution_width: 1920
      resolution_height: 1080
      frame_rate_fps: 30

    # Payload parameters
    payload:
      max_weight_kg: 5
      drop_delay_seconds: 0.5

    # System health check interval (seconds)
    health_check_interval: 2.0
